spring:
  application:
    name: support-ticket-service
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpflow}
    username: ${DB_USER:helpflow}
    password: ${DB_PASSWORD:helpflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
helpflow:
  dispatch:
    url: ${DISPATCH_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 3s
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-32b}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
